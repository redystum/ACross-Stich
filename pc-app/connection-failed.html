<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Across Stitch — Connect to Raspberry Pi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.35); }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }
    .card {
      background: #18181b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .icon { font-size: 42px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 13px; color: #a1a1aa; line-height: 1.5; margin-bottom: 24px; }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
      text-align: left;
    }
    label { font-size: 12px; font-weight: 500; color: #d4d4d8; }
    input {
      background: #09090b;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #10b981; }
    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      background: #10b981;
      color: #09090b;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .secondary-btn {
      margin-top: 10px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: #a1a1aa;
    }
    .secondary-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🧵</div>
    <h1>Connect to Across Stitch Server</h1>
    <p>Could not reach the server at the configured address. Enter the IP address or hostname of your Raspberry Pi server below:</p>

    <div class="input-group">
      <label for="server-url">Raspberry Pi Server URL</label>
      <input type="text" id="server-url" placeholder="http://raspberrypi.local:3000" value="http://localhost:3000">
    </div>

    <button class="btn" id="btn-connect">Connect to Server</button>
    <button class="btn secondary-btn" id="btn-local">Try Localhost (3000)</button>
  </div>

  <script>
    const input = document.getElementById('server-url');
    if (window.electronAPI) {
      window.electronAPI.getServerUrl().then(url => {
        if (url) input.value = url;
      });
    }

    document.getElementById('btn-connect').addEventListener('click', () => {
      const url = input.value.trim();
      if (!url) return;
      if (window.electronAPI) {
        window.electronAPI.setServerUrl(url);
      } else {
        window.location.href = url;
      }
    });

    document.getElementById('btn-local').addEventListener('click', () => {
      if (window.electronAPI) {
        window.electronAPI.setServerUrl('http://localhost:3000');
      } else {
        window.location.href = 'http://localhost:3000';
      }
    });
  </script>
</body>
</html>
